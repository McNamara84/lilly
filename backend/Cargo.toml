[package]
name = "lilly-backend"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "mysql", "migrate", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
argon2 = "0.5.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
http = "1.5.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
validator = { version = "0.21.0", features = ["derive"] }
dotenvy = "0.15.7"
thiserror = "2.0.20"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
cron = "0.17.0"
anyhow = "1.0.104"
async-trait = "0.1.92"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }
sha2 = "0.11.0"
rand = "0.10.2"
zxcvbn = "3.1.1"
axum-extra = { version = "0.12.6", features = ["cookie"] }
hex = "0.4.3"
time = "0.3.55"
lilly-importer-core = { path = "../importer-core" }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
