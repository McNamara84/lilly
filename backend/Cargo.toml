[package]
name = "lilly-backend"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.54.1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "mysql", "migrate", "chrono", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
argon2 = "0.6.0"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
http = "1.5.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
validator = { version = "0.21.0", features = ["derive"] }
dotenvy = "0.15.7"
thiserror = "2.0.21"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
cron = "0.17.0"
anyhow = "1.0.104"
async-trait = "0.1.92"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }
sha2 = "0.11.1"
rand = "0.10.3"
zxcvbn = "3.1.1"
axum-extra = { version = "0.12.6", features = ["cookie"] }
hex = "0.4.3"
hashlink = "0.12.2"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
time = "0.3.55"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
url = "2.5.8"
ipnet = "2.12.2"
lilly-importer-core = { path = "../importer-core" }
lilly-importer-adapters = { path = "../importer-adapters" }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.2", default-features = false, features = ["axum", "vendored"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
jsonschema = { version = "0.60.2", default-features = false }
tower = { version = "0.5.3", features = ["util"] }
