name: Security

on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "frontend/package-lock.json"
      - "frontend/package.json"
      - ".github/workflows/security.yml"
  schedule:
    # Weekly, so newly published advisories surface without a code change.
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-audit:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@12.0.2
      # Only dependencies that ship in the production image can block; findings in development
      # tooling are reviewed via `npm audit` and tracked as issues.
      - run: npm audit --omit=dev --audit-level=high

  backend-audit:
    name: Backend Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
