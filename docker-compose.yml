services:
  db:
    image: mariadb:12.3.2
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: lilly-backend:e2e
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY}
      PASSWORD_RESET_TTL_SECONDS: ${PASSWORD_RESET_TTL_SECONDS:-3600}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-2026-08-14}
      RUST_LOG: ${RUST_LOG}
      BACKEND_PORT: ${BACKEND_PORT}
      ENABLE_DEMO_SEED: ${ENABLE_DEMO_SEED:-false}
      E2E_WORKER_COUNT: ${E2E_WORKER_COUNT:-0}
      ENABLE_E2E_FIXTURE_ADAPTER: ${ENABLE_E2E_FIXTURE_ADAPTER:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-5/900}
      RATE_LIMIT_LOGIN_CLIENT: ${RATE_LIMIT_LOGIN_CLIENT:-30/900}
      RATE_LIMIT_LOGIN_ACCOUNT: ${RATE_LIMIT_LOGIN_ACCOUNT:-10/900}
      RATE_LIMIT_RESEND_VERIFICATION: ${RATE_LIMIT_RESEND_VERIFICATION:-5/900}
      RATE_LIMIT_PASSWORD_RESET_REQUEST: ${RATE_LIMIT_PASSWORD_RESET_REQUEST:-5/900}
      RATE_LIMIT_PASSWORD_RESET_CONFIRM: ${RATE_LIMIT_PASSWORD_RESET_CONFIRM:-10/900}
      RATE_LIMIT_OAUTH_START: ${RATE_LIMIT_OAUTH_START:-10/60}
      RATE_LIMIT_OAUTH_CALLBACK: ${RATE_LIMIT_OAUTH_CALLBACK:-30/300}
      RATE_LIMIT_REFRESH: ${RATE_LIMIT_REFRESH:-60/60}
      RATE_LIMIT_PUBLIC_API: ${RATE_LIMIT_PUBLIC_API:-120/60}
      RATE_LIMIT_AUTHENTICATED_API: ${RATE_LIMIT_AUTHENTICATED_API:-600/60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@lilly.app}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MEDIA_PATH: /media
      MEDIA_URL_PREFIX: ${MEDIA_URL_PREFIX:-/media}
      PHOTO_MAX_UPLOAD_BYTES: ${PHOTO_MAX_UPLOAD_BYTES:-5242880}
      PHOTO_MAX_COUNT: ${PHOTO_MAX_COUNT:-4}
      PHOTO_MAX_EDGE: ${PHOTO_MAX_EDGE:-2048}
      PHOTO_MAX_SOURCE_DIMENSION: ${PHOTO_MAX_SOURCE_DIMENSION:-10000}
      PHOTO_MAX_SOURCE_PIXELS: ${PHOTO_MAX_SOURCE_PIXELS:-40000000}
      PHOTO_JPEG_QUALITY: ${PHOTO_JPEG_QUALITY:-85}
      IMPORT_SCHEDULER_ENABLED: ${IMPORT_SCHEDULER_ENABLED:-false}
      IMPORT_SCHEDULE: ${IMPORT_SCHEDULE:-0 10 6 * * Sat *}
      IMPORT_TIMEZONE: ${IMPORT_TIMEZONE:-Europe/Berlin}
      IMPORT_SCHEDULED_ADAPTERS: ${IMPORT_SCHEDULED_ADAPTERS:-maddrax,john-sinclair}
    volumes:
      - media_data:/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${BACKEND_PORT:-8080}/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: lilly-frontend:e2e
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2.11.4-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - media_data:/srv/media:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
  caddy_data:
  media_data:
