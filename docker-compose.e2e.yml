services:
  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    environment:
      MP_MAX_MESSAGES: "200"
    ports:
      - "127.0.0.1:8025:8025"

  backend:
    environment:
      ENABLE_DEMO_SEED: "true"
      E2E_WORKER_COUNT: "4"
      ENABLE_E2E_FIXTURE_ADAPTER: "true"
      API_DOCS_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS_MODE: none
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: noreply@lilly.app
      APP_BASE_URL: http://localhost
      # A parallel full browser suite intentionally generates far more public
      # requests and logins than a real client. All browser workers share the
      # proxy address; production limits remain unchanged outside this override.
      RATE_LIMIT_PUBLIC_API: "10000/60"
      RATE_LIMIT_AUTHENTICATED_API: "10000/60"
      RATE_LIMIT_LOGIN_CLIENT: "1000/60"
      RATE_LIMIT_LOGIN_ACCOUNT: "100/60"
      DATA_TRANSFER_MAX_JOBS_PER_DAY: "1000"
    depends_on:
      mailpit:
        condition: service_started
